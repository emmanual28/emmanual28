<text x="56" y="151" fill="#f6f9ff" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="51">Emmanual Sebastian</text>
<rect x="58" y="170" width="92" height="4" rx="2" fill="url(#accent)"/>
<text x="56" y="221" fill="#a7d9f3" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500">Backend / Full-Stack Developer</text>
<text x="56" y="269" fill="#b0c5db" font-family="Arial, Helvetica, sans-serif" font-size="17">Node.js  •  REST APIs  •  Authentication  •  AI Integration</text>
