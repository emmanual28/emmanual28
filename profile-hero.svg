<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Emmanual Sebastian — Backend and Full-Stack Developer</title>
<desc id="desc">Navy blue developer portfolio banner with cyan accents and an abstract connected-system diagram.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#09172c"/>
  <stop offset="55%" stop-color="#0e2340"/>
  <stop offset="100%" stop-color="#102d4b"/>
 </linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#47e5d4"/>
  <stop offset="100%" stop-color="#70aaff"/>
 </linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
  <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
 </pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="340" rx="25" fill="url(#bg)"/>
